[project]
name = "df-augment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Myles Johnson", email = "mylesadebayo2021@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "typer>=0.27.3",
]

[project.scripts]
df-augment = "df_augment:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
